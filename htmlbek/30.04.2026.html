<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .main {
            width: 100%;
            height: 800 px;
        }

        .started {
            width: 404px;
            height: 638px;
            margin-top: 220px;
            margin-left: 500px;
        }

        .get {
            width: 262px;
            height: 52.52830123901367px;
            font-size: 17px;
        }

        .name {
            width: 404px;
            height: 58px;   
            margin-top: 58px;
        }

        .name input {
            width: 402px;
            height: 32px;
            border-radius: 10px;
            border: 1px solid gray;
        }

        .email {
            width: 404px;
            height: 58px;
            margin-top: 19px;
        }

        .email input {
            width: 402px;
            height: 32px;
            border-radius: 10px;
            border: 1px solid gray;
        }

        .signup button {
            width: 404px;
            height: 35.01886749267578px;
            margin-top: 64px;
            background-color: green;
            color: white;
            border-radius: 10px;
            border: 1px solid green;
        }

        .or {
            width: 400px;
            height: 15.320755004882812px;
            margin-top: 59px;
            text-align: center;
        }

        .google-va-app {
            width: 404px;
            height: 35.01886749267578px;
            margin-top: 60px;
            display: flex;
            justify-content: space-between;
        }

        .google {
            width: 190px;
            height: 32px;
            border: 1px solid gray;
            border-radius: 10px;
        }

        .with {
            width: 142px;
            height: 24px;
            margin-left: 24px;
            margin-top: 4px;
            display: flex;
            justify-content: space-around;
        }

        .logo {
            width: 24px;
            height: 24px;
        }

        .in {
            width: 108px;
            height: 18px;
        }

        .accaunt {
            width: 183px;
            height: 22.98113250732422px;
            margin-top: 23px;
            margin-left: 113px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="started">
            <div class="get">
                <h1>Get Started Now</h1>
            </div>

            <div class="name">
                <label for="name">Name</label>
                <br>
                <input type="name">
            </div>

            <div class="email">
                <label for="name">Email address</label>
                <br>
                <input type="email">
            </div>

            <div class="email">
                <label for="name">Password</label>
                <br>
                <input type="password">
            </div>

            <div class="signup">
                <button>Signup</button>
            </div>

            <div class="or">
                <p>Or</p>
            </div>

            <div class="google-va-app">
                <div class="google">
                    <div class="with">
                        <div class="logo">
                            <i class="fa-brands fa-google" style="color: rgb(0, 0, 0);"></i>
                        </div>

                        <div class="in">
                            <h5>Sign in with google</h5>
                        </div>
                    </div>
                </div>

                <div class="google">
                    <div class="with">
                        <div class="logo">
                            <i class="fa-brands fa-apple" style="color: rgb(0, 0, 0);"></i>
                        </div>

                        <div class="in">
                            <h5>Sign in with Apple</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="accaunt">
                <h4>Have an account? Sign In</h4>
            </div>
        </div>
    </div>
</body>
</html>
